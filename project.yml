name: MorseTrainerApp
options:
  bundleIdPrefix: com.morsetrainer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  MorseTrainer:
    path: .
targets:
  MorseTrainerApp:
    type: application
    platform: [macOS, iOS]
    sources: [App/MorseTrainerApp.swift]
    dependencies:
      - package: MorseTrainer
        product: MorseUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.morsetrainer.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  MorseTrainerApp:
    build:
      targets:
        MorseTrainerApp_macOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  MorseTrainerApp-iOS:
    build:
      targets:
        MorseTrainerApp_iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
