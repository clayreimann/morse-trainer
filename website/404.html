<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Dah Vinci</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --grad-1: #4F46E5;
    --grad-2: #2563EB;
    --grad-3: #06B6D4;
    --gradient: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
    --bg: #ffffff;
    --text: #171a26;
    --text-dim: #565b72;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0b12;
      --text: #edeef6;
      --text-dim: #a6abc2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .notfound { padding: 24px; max-width: 420px; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 24px; display: block; box-shadow: 0 10px 28px rgba(37,99,235,0.25); }
  .code {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; letter-spacing: -0.01em; }
  p { color: var(--text-dim); margin: 0 0 28px; }
  a.home-link {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--gradient);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    font-size: 0.95rem;
  }
  a.home-link:hover { opacity: 0.92; }
</style>
</head>
<body>
  <div class="notfound">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dah Vinci logo">
      <defs>
        <linearGradient id="grad404" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4F46E5"/>
          <stop offset="0.5" stop-color="#2563EB"/>
          <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="24" fill="url(#grad404)"/>
      <rect x="22" y="36" width="56" height="13" rx="6.5" fill="#ffffff"/>
      <rect x="22" y="57" width="56" height="13" rx="6.5" fill="#ffffff" opacity="0.94"/>
    </svg>
    <p class="code">····· ····· ····· ····· (404)</p>
    <h1>Signal lost.</h1>
    <p>That page doesn't exist — dit-dah-dit-dit into the void, apparently.</p>
    <a class="home-link" href="/">Back to Dah Vinci</a>
  </div>
</body>
</html>
